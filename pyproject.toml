[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "pygwtf"
description = "Waveform generation and likelihood approximations for slowly-evolving GW sources in the time-frequency domain."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Christian Chapman-Bird" }, { name = "Diganta Bandopadhyay" }]
dependencies = [
    "scipy",
    "matplotlib",
    "numpy",
    "array-api-compat",
    "lisaconstants",
    "astropy",
    "h5py",
]
dynamic = [
    "version"
]

[project.optional-dependencies]
legacy = ["numba"]  # v1 reference implementation (pygwtf.legacy)
dev = [
    "pre-commit",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "numba",
]


[project.urls]
Homepage = "https://github.com/cchapmanbird/gwtf"
Repository = "https://github.com/cchapmanbird/gwtf"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/pygwtf"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/cpp"]

[tool.scikit-build.cmake.define]
GWTF_GPU = {env = "GWTF_GPU", default = "AUTO"}

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires the GPU backend and a device",
    "legacy: compares against the numba v1 implementation (slow, needs numba)",
]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]
